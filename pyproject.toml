[project]
name = "facebook-ads-library-mcp"
version = "3.0.0"
description = "Hardened Facebook Ads Intelligence & Campaign Management MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.7",
    "crawl4ai==0.9.2",
    "requests==2.34.2",
    "pydantic>=2.10.0",
    "cloudinary>=1.41.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "pip-audit>=2.8.0",
    "responses>=0.25.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "legacy",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
